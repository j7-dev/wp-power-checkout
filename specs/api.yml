openapi: 3.0.3
info:
  title: Power Checkout REST API
  description: |
    WooCommerce 結帳整合外掛 REST API，提供金流設定管理、退款操作、電子發票開立/作廢，以及 Shopline Payment Webhook 接收。

    ## 錯誤碼對應規則
    - **400** = 前置（參數）Rules 驗證失敗
    - **401** = 未登入或 Nonce 無效
    - **403** = 前置（狀態）Rules 不符
    - **404** = 資源找不到
    - **500** = 伺服器內部錯誤（Exception）

    ## 認證
    所有管理端 API 需要 WordPress 登入 Cookie 加上 `X-WP-Nonce` Header（`wp_create_nonce('wp_rest')`）。
    Webhook 端點使用 HMAC-SHA256 簽章驗證，不需要 WordPress 認證。

    ## 綠界 ECPay 幕後通知端點（power-checkout/ecpay 命名空間）
    綠界 ECPay 的 callback / 前端 API 不使用 WordPress 認證（`permission_callback` 一律 `__return_true`），
    授權在 callback 內以協定機制把關：
    - `aio/return`、`aio/payment-info`：以 **CheckMacValue（SHA256）** timing-safe 驗章；驗章失敗仍回 `1|OK`（避免綠界重送風暴）。
    - `ecpg/return`：JSON POST，雙層檢查（傳輸層 `TransCode===1` → **AES-128-CBC 解密 Data** → 業務層 `RtnCode`）；解密失敗仍回 `1|OK`。
    - `ecpg/create-payment`：前端 SDK 取得 PayToken 後送回，以 **WooCommerce `order_key`** 比對擁有權（非 nonce，因支援訪客結帳）。
    - 三個 callback（`aio/*`、`ecpg/return`）回應一律為**純文字 `1|OK`、HTTP 200**（非 JSON）。

    ## 綠界全方位物流 v2 端點（Logistics domain，統一抽象 ILogisticsProvider）
    物流管理端 API（store-selection / create-shipment / query / print / cancel）走 `power-checkout/v1/logistics`，需 Nonce。
    物流 callback（selection-callback / status-callback）走 `power-checkout/ecpay`，不需 WordPress 認證：
    - `logistics/selection-callback`：綠界選店 Form POST ResultData，以 **AES-128-CBC 解密能力**把關。
    - `logistics/status-callback`：綠界貨態 JSON POST（AES-JSON 三層），驗 MerchantID + 比對 LogisticsID + 防重；
      回應**必須是 AES 加密 JSON 三層結構**（非 1|OK），否則綠界隔 60 分重送最多 3 次。

    ## 錯誤處理
    所有端點的錯誤以 Exception 形式拋出，WordPress REST API 框架統一捕獲後回傳 HTTP 500 + 錯誤訊息。
  version: "1.3.0"

servers:
  - url: /wp-json/power-checkout/v1
    description: 主要 API 命名空間（Settings / Payment）
  - url: /wp-json/power-checkout/v1/invoices
    description: 電子發票 API 命名空間
  - url: /wp-json/power-checkout/slp
    description: Shopline Payment Webhook 命名空間
  - url: /wp-json/power-checkout/ecpay
    description: 綠界 ECPay 幕後通知 / 前端 API 命名空間（AIO / ECPG / 物流 callback）
  - url: /wp-json/power-checkout/v1/logistics
    description: 綠界全方位物流管理 API 命名空間（統一抽象 ILogisticsProvider）

tags:
  - name: Settings
    description: 金流/發票服務設定管理
  - name: Payment
    description: 退款相關操作
  - name: Invoice
    description: 電子發票開立與作廢
  - name: Webhook
    description: Shopline Payment Webhook 接收
  - name: ECPay
    description: 綠界 ECPay 幕後通知（AIO ReturnURL / PaymentInfoURL、ECPG ReturnURL）與站內付前端 API
  - name: Logistics
    description: 綠界全方位物流 v2（選店 / 成立物流單 / 查詢 / 列印 / 取消 / 貨態 callback），統一抽象 ILogisticsProvider

components:
  securitySchemes:
    wpNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress REST Nonce（`wp_create_nonce('wp_rest')`）
    hmacSha256:
      type: apiKey
      in: header
      name: sign
      description: HMAC-SHA256 of "{timestamp}.{body}" using signKey

  schemas:
    # ===== 共用 =====
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 回應代碼
        message:
          type: string
          description: 回應訊息
        data:
          description: 回應資料（結構依端點而異）

    Error:
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
          example: "找不到訂單"
        data:
          type: object
          nullable: true

    # ===== Settings =====
    ProviderSummary:
      type: object
      description: Provider 摘要資訊（用於列表顯示，不含敏感金鑰）
      properties:
        id:
          type: string
          example: "shopline_payment_redirect"
        title:
          type: string
          example: "Shopline Payment 線上付款"
        enabled:
          type: string
          enum: ["yes", "no"]
        icon:
          type: string
          format: uri
        method_title:
          type: string
        method_description:
          type: string

    ShoplinePaymentSettings:
      type: object
      description: Shopline Payment 完整設定
      properties:
        enabled:
          type: string
          enum: ["yes", "no"]
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          format: uri
        order_button_text:
          type: string
        mode:
          type: string
          enum: [test, prod]
        platformId:
          type: string
          description: SLP 平台 ID
        merchantId:
          type: string
        apiKey:
          type: string
        clientKey:
          type: string
        signKey:
          type: string
        apiUrl:
          type: string
          format: uri
        allowPaymentMethodList:
          type: array
          items:
            type: string
            enum: [CreditCard, VirtualAccount, JKOPay, ApplePay, LinePay, ChaileaseBNPL]
        paymentMethodOptions:
          type: object
          additionalProperties:
            type: object
            properties:
              installmentCounts:
                type: array
                items:
                  type: string
        expire_min:
          type: integer
          description: 付款截止時間（分鐘）
        min_amount:
          type: integer
          description: 最小交易金額
          minimum: 5
        max_amount:
          type: integer
          description: 最大交易金額
          maximum: 50000

    AmegoSettings:
      type: object
      description: 光貿電子發票完整設定
      properties:
        enabled:
          type: string
          enum: ["yes", "no"]
        title:
          type: string
        description:
          type: string
        icon:
          type: string
          format: uri
        method_title:
          type: string
        mode:
          type: string
          enum: [test, prod]
        invoice:
          type: string
          description: 商家統一編號
        app_key:
          type: string
          description: 光貿 API 金鑰
        tax_rate:
          type: number
          format: float
          example: 0.05
        auto_issue_order_statuses:
          type: array
          items:
            type: string
          description: 自動開立發票的訂單狀態（如 ["wc-processing"]）
        auto_cancel_order_statuses:
          type: array
          items:
            type: string
          description: 自動作廢發票的訂單狀態（如 ["wc-refunded"]）

    # ===== Invoice =====
    InvoiceIssueRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [amego, ecpay, ezpay]
          description: 電子發票 Provider ID（amego = 光貿；ecpay = 綠界電子發票；ezpay = ezPay 電子發票，藍新 NewebPay）
          example: "amego"
        invoiceType:
          type: string
          enum: [individual, company, donate]
          description: 發票類型
        individual:
          type: string
          enum: [cloud, barcode, moica, paper]
          description: 個人發票載具類型
        carrier:
          type: string
          description: 手機條碼載具號碼
        moica:
          type: string
          description: 自然人憑證號碼
        companyName:
          type: string
          description: 公司名稱（invoiceType=company 時必填）
        companyId:
          type: string
          description: 公司統一編號（invoiceType=company 時必填）
        donateCode:
          type: string
          description: 捐贈碼（invoiceType=donate 時必填）

    # ===== Webhook =====
    WebhookPayload:
      type: object
      description: Shopline Payment Webhook 通知內容
      properties:
        eventType:
          type: string
          description: 事件類型（如 session.succeeded, trade.succeeded, refund.succeeded）
          example: "trade.succeeded"
        data:
          type: object
          description: 事件資料（結構依事件類型而異），包含 tradeOrderId、status 等欄位

    # ===== 綠界 ECPay =====
    EcpayAioReturnPayload:
      type: object
      description: |
        綠界 AIO 付款結果通知（ReturnURL）— Form POST（application/x-www-form-urlencoded）。
        所有欄位（除 CheckMacValue 自身）參與 CheckMacValue（SHA256）計算。RtnCode 為**字串**。
      required: [MerchantID, MerchantTradeNo, RtnCode, CheckMacValue]
      properties:
        MerchantID:
          type: string
          example: "3002607"
        MerchantTradeNo:
          type: string
          description: 商店交易編號（冪等鍵，對應 order meta _pc_ecpay_trade_no）
          example: "EC100ABCDEF"
        RtnCode:
          type: string
          description: 付款回應碼（字串）。"1"=付款成功；其他=失敗
          example: "1"
        RtnMsg:
          type: string
          example: "交易成功"
        TradeNo:
          type: string
          description: 綠界交易編號
        TradeAmt:
          type: string
        PaymentDate:
          type: string
          example: "2025/01/01 12:05:00"
        PaymentType:
          type: string
          description: 實際付款方式（回傳值，如 Credit_CreditCard ≠ 送出的 Credit）
          example: "Credit_CreditCard"
        SimulatePaid:
          type: string
          enum: ["0", "1"]
        CheckMacValue:
          type: string
          description: 檢查碼（SHA256，大寫 hex）。驗章演算法：ksort → HashKey 前綴/HashIV 後綴 → .NET urlencode → 小寫 → SHA256 → 大寫

    EcpayAioPaymentInfoPayload:
      type: object
      description: |
        綠界 AIO 取號結果通知（PaymentInfoURL）— Form POST。ATM/CVS/BARCODE 取號成功後送達（非同步，付款前）。
        RtnCode："2"=ATM 取號成功；"10100073"=CVS/BARCODE 取號成功（**非錯誤**，消費者尚未付款）。
      required: [MerchantID, MerchantTradeNo, RtnCode, CheckMacValue]
      properties:
        MerchantID:
          type: string
        MerchantTradeNo:
          type: string
          example: "EC100ABCDEF"
        RtnCode:
          type: string
          description: 取號回應碼（字串）。"2"=ATM 取號成功；"10100073"=CVS/BARCODE 取號成功
          example: "2"
        PaymentType:
          type: string
          example: "ATM_TAISHIN"
        BankCode:
          type: string
          description: ATM 銀行代碼（ATM 取號時）
        vAccount:
          type: string
          description: ATM 虛擬帳號（ATM 取號時）
        PaymentNo:
          type: string
          description: 超商繳費代碼（CVS 取號時）
        Barcode1:
          type: string
          description: 超商條碼第一段（BARCODE 取號時）
        Barcode2:
          type: string
        Barcode3:
          type: string
        ExpireDate:
          type: string
          description: 繳費期限
        CheckMacValue:
          type: string

    EcpgReturnPayload:
      type: object
      description: |
        綠界站內付 2.0（ECPG）付款結果通知（ReturnURL）— Server-to-Server JSON POST（application/json）。
        外層三層結構，Data 為 AES-128-CBC 密文。雙層錯誤檢查：傳輸層 TransCode（整數）===1 → 解密 Data → 業務層 RtnCode（整數）。
      required: [MerchantID, TransCode, Data]
      properties:
        MerchantID:
          type: string
          example: "3002607"
        RpHeader:
          type: object
          description: 回應表頭（含 Timestamp）
          properties:
            Timestamp:
              type: integer
        TransCode:
          type: integer
          description: 傳輸層回應碼（整數）。1=傳輸成功才解密 Data
          example: 1
        TransMsg:
          type: string
        Data:
          type: string
          description: |
            AES-128-CBC 密文（Base64 標準 alphabet）。解密流程：base64_decode → AES decrypt → urldecode → json_decode。
            解密後含巢狀 OrderInfo.MerchantTradeNo 與業務層 RtnCode（整數 1=付款成功）。

    EcpgCreatePaymentRequest:
      type: object
      description: 前端站內付 SDK 取得 PayToken 後送回，觸發後端 CreatePayment
      required: [order_id, order_key, pay_token]
      properties:
        order_id:
          type: integer
          description: WooCommerce 訂單 ID
          example: 100
        order_key:
          type: string
          description: WooCommerce 訂單 order_key（擁有權憑證，比對 $order->get_order_key()）
          example: "wc_order_abc123"
        pay_token:
          type: string
          description: 站內付 SDK 收卡後取得的付款 Token

    EcpgCreatePaymentResponse:
      type: object
      description: CreatePayment 結果（response format：{ code, message, data }）
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [success, error]
          example: "success"
        message:
          type: string
          example: "需完成 3D 驗證"
        data:
          type: object
          nullable: true
          properties:
            three_d_url:
              type: string
              description: 3DS 驗證導向 URL（取自巢狀 ThreeDInfo.ThreeDURL；2025/8 起幾乎必出現）
            need_3ds:
              type: boolean
              description: 是否需導向 3D 驗證

    # ===== Logistics（綠界全方位物流 v2 / 統一抽象 ILogisticsProvider）=====
    LogisticsSubType:
      type: string
      enum: [FAMI, UNIMART, HILIFE, HOME]
      description: 物流子類型（全家 / 統一 / 萊爾富 / 宅配）

    LogisticsStoreSelectionResponse:
      type: object
      required: [code, message]
      description: 取得選店導轉頁回應；成功時 data 含導轉目標（綠界 RWD 選店頁）
      properties:
        code:
          type: string
          example: "success"
        message:
          type: string
          example: "取得選店頁成功"
        data:
          type: object
          nullable: true
          properties:
            redirect_target:
              type: string
              description: 綠界 RWD 選店頁 HTML（PostWithAesStrResponseService 回傳的 body，供前端導轉）

    LogisticsSelectionCallbackPayload:
      type: object
      required: [ResultData]
      description: 綠界選店回呼（ClientReplyURL，瀏覽器 Form POST）
      properties:
        ResultData:
          type: string
          description: AES 加密的選店結果（解密後含 TempLogisticsID 與門市資訊）

    LogisticsShipmentResponse:
      type: object
      required: [code, message]
      description: 成立正式物流單回應
      properties:
        code:
          type: string
          example: "success"
        message:
          type: string
          example: "物流單成立成功"
        data:
          type: object
          nullable: true
          properties:
            logistics_id:
              type: string
              description: 統一物流單號（綠界 LogisticsID，存 _pc_logistics_ref）

    LogisticsQueryResponse:
      type: object
      required: [code, message]
      description: 查詢物流單即時狀態回應
      properties:
        code:
          type: string
          example: "success"
        message:
          type: string
          example: "查詢成功"
        data:
          type: object
          nullable: true
          properties:
            logistics_id:
              type: string
              description: 物流單號
            status:
              type: string
              description: 即時貨態（綠界 LogisticsStatus）
            store_info:
              type: object
              nullable: true
              description: 門市資訊（超商取貨時）
              properties:
                store_id:
                  type: string
                store_name:
                  type: string
                store_addr:
                  type: string

    LogisticsStatusCallbackPayload:
      type: object
      required: [MerchantID, TransCode, Data]
      description: |
        綠界全方位物流貨態通知（ServerReplyURL，JSON body POST，AES-JSON 三層結構）。
        外層 TransCode（整數）=== 1 → 解密 Data → 內層 RtnCode（整數）。
      properties:
        MerchantID:
          type: string
          description: 綠界特店編號（須驗證為本商店 B2C 或 C2C 帳號）
        RqHeader:
          type: object
          properties:
            Timestamp:
              type: integer
        TransCode:
          type: integer
          description: 傳輸層代碼（1 = 傳輸成功）
        TransMsg:
          type: string
        Data:
          type: string
          description: AES-128-CBC 加密的貨態資料（解密後含 RtnCode/LogisticsID/LogisticsStatus）

    LogisticsAesJsonResponse:
      type: object
      required: [MerchantID, TransCode, Data]
      description: |
        綠界全方位物流 callback 的回應格式（AES 加密 JSON 三層結構，非 1|OK）。
        未正確回應時綠界隔 60 分重送，當天最多 3 次。
      properties:
        MerchantID:
          type: string
        RqHeader:
          type: object
          properties:
            Timestamp:
              type: integer
        TransCode:
          type: integer
          example: 1
        TransMsg:
          type: string
        Data:
          type: string
          description: AES 加密的 { RtnCode, RtnMsg }

security:
  - wpNonce: []

paths:
  # ==================== Settings ====================

  /settings:
    get:
      tags: [Settings]
      summary: 取得所有設定
      description: |
        回傳 gateways、invoices、logistics 三個分類的 Provider 摘要清單。
        Gateway 摘要不包含敏感金鑰（apiKey、clientKey、signKey）。
      operationId: getAllSettings
      security:
        - wpNonce: []
      responses:
        "200":
          description: 取得設定成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "get_settings_success"
                      message:
                        example: "取得設定成功"
                      data:
                        type: object
                        required: [gateways, invoices, logistics]
                        properties:
                          gateways:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProviderSummary"
                          invoices:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProviderSummary"
                          logistics:
                            type: array
                            items:
                              type: object
        "401":
          description: 未登入或 Nonce 無效

  /settings/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-zA-Z_-]+$"
        description: Provider 識別碼
        examples:
          slp:
            value: "shopline_payment_redirect"
          amego:
            value: "amego"

    get:
      tags: [Settings]
      summary: 取得單一服務設定
      description: 回傳指定 Provider 的完整設定（含敏感金鑰）。
      operationId: getProviderSettings
      security:
        - wpNonce: []
      responses:
        "200":
          description: 取得設定成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "success"
                      data:
                        type: object
                        description: |
                          Provider 設定（結構依 provider 而異）：
                          - shopline_payment_redirect: ShoplinePaymentSettings
                          - amego: AmegoSettings
        "401":
          description: 未登入或 Nonce 無效
        "500":
          description: "找不到 Provider（Can't find Provider with provider_id: {id}）"

    post:
      tags: [Settings]
      summary: 更新服務設定
      description: |
        更新指定 Provider 的設定值。所有參數值會經過 sanitize_text_field_deep 消毒。
        設定寫入 wp_options 表（key: woocommerce_{provider_id}_settings）。
      operationId: updateProviderSettings
      security:
        - wpNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 設定欄位 key-value pairs（依 provider 而異，未傳的欄位不會被覆蓋）
      responses:
        "200":
          description: 儲存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "success"
                      message:
                        example: "儲存成功"
                      data:
                        type: object
                        description: 更新後的完整設定
        "401":
          description: 未登入或 Nonce 無效

  /settings/{provider_id}/toggle:
    post:
      tags: [Settings]
      summary: 開關服務
      description: 將 Provider 的 enabled 值在 yes/no 之間切換。
      operationId: toggleProvider
      security:
        - wpNonce: []
      parameters:
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-zA-Z_-]+$"
      responses:
        "200":
          description: 切換成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "success"
                      message:
                        type: string
                        description: '"{provider_id} 啟用成功" 或 "{provider_id} 禁用成功"'
                      data:
                        type: string
                        description: provider_id
                        example: "amego"
        "401":
          description: 未登入或 Nonce 無效

  # ==================== Payment ====================

  /refund:
    post:
      tags: [Payment]
      summary: Gateway 退款
      description: |
        透過訂單的 Payment Gateway 進行退款。退款金額為訂單剩餘可退金額（全額或部分）。
        限制：
        - ATM 虛擬帳號不支援退款
        - 中租零卡僅支援全額退款
        - Apple Pay 僅支援全額退款
        - Credit Card / LINE Pay 支援全額與部分退款
        - Gateway 必須是 AbstractPaymentGateway 實例
      operationId: refund
      security:
        - wpNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: integer
                  description: 訂單 ID
                  example: 100
      responses:
        "200":
          description: 退款成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "success"
                      message:
                        type: string
                        example: "訂單 #100 透過 Shopline Payment 線上付款 退款成功"
                      data:
                        nullable: true
        "500":
          description: |
            退款失敗，錯誤訊息依情境：
            - "訂單編號必須是數字"（order_id 非數字）
            - "找不到訂單 #9999"（訂單不存在）
            - "訂單 #100 已經沒有餘額可退"（餘額為 0）
            - "Gateway 不是 AbstractPaymentGateway 的實例"（非 Power Checkout Gateway）
            - "{付款方式} 不支援退款"（ATM 虛擬帳號）
            - "{付款方式} 僅支援全額退款，不支援部分退款"（中租零卡、Apple Pay）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /refund/manual:
    post:
      tags: [Payment]
      summary: 手動退款
      description: |
        僅將訂單狀態改為 refunded，不透過 Gateway API 退款。
        觸發 woocommerce_order_refunded hook 後會自動新增手動退款 order note。
      operationId: manualRefund
      security:
        - wpNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: integer
                  description: 訂單 ID
                  example: 100
      responses:
        "200":
          description: 手動退款成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      code:
                        example: "success"
                      message:
                        type: string
                        example: "訂單 #100 手動退款成功"
                      data:
                        nullable: true
        "500":
          description: |
            退款失敗，錯誤訊息依情境：
            - "order_id must be numeric"（order_id 非數字）
            - "#9999 order not found"（訂單不存在）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== Invoice ====================
  # 注意：以下端點的 base URL 為 /wp-json/power-checkout/v1/invoices

  /issue/{order_id}:
    post:
      tags: [Invoice]
      summary: 開立電子發票
      description: |
        為指定訂單開立電子發票。若已開立過則直接回傳已有資料，不重複呼叫 API。
        開立前會先將發票參數儲存至 order meta（_pc_issue_invoice_params）。
        支援三種發票類型：個人（雲端/條碼/自然人/紙本）、公司、捐贈。
        provider 可為 `amego`（光貿）或 `ecpay`（綠界電子發票，AES-128-CBC）；兩者沿用同一端點與 meta key。
      operationId: issueInvoice
      security:
        - wpNonce: []
      servers:
        - url: /wp-json/power-checkout/v1/invoices
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: WooCommerce 訂單 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceIssueRequest"
      responses:
        "200":
          description: |
            開立成功（或已開立過，回傳已有資料）。
            成功時訂單新增以下 meta：
            - _pc_issued_invoice_data: 發票開立回傳資料
            - _pc_invoice_provider_id: 使用的 provider（"amego" 或 "ecpay"）
            - _pc_issue_invoice_params: 結帳頁填寫的發票參數
          content:
            application/json:
              schema:
                type: object
                description: 發票開立回傳資料（結構依 provider 而異）
        "500":
          description: |
            開立失敗，錯誤訊息依情境：
            - "找不到電子發票服務 id: {provider}，請檢查是否啟用"（provider 不存在）
            - "{provider} 不是 Invoice Service"（provider 非 IInvoiceService）
            - "找不到訂單 order_id:{id}"（訂單不存在）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cancel/{order_id}:
    post:
      tags: [Invoice]
      summary: 作廢電子發票
      description: |
        作廢指定訂單的電子發票。若已作廢過則直接回傳已有資料，不重複呼叫 API。
        成功作廢時清除開立相關 meta（_pc_issue_invoice_params、_pc_issued_invoice_data、_pc_invoice_provider_id），
        並儲存作廢資料至 _pc_cancelled_invoice_data。
      operationId: cancelInvoice
      security:
        - wpNonce: []
      servers:
        - url: /wp-json/power-checkout/v1/invoices
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: WooCommerce 訂單 ID
      responses:
        "200":
          description: 作廢成功（或已作廢過，回傳已有資料）
          content:
            application/json:
              schema:
                type: object
                description: 發票作廢回傳資料（結構依 provider 而異）
        "500":
          description: |
            作廢失敗，錯誤訊息依情境：
            - "找不到訂單 order_id:{id}"（訂單不存在）
            - "{provider_id} 不是 Invoice Service"（provider 無效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== Webhook ====================
  # 注意：此端點的 base URL 為 /wp-json/power-checkout/slp

  /webhook:
    post:
      tags: [Webhook]
      summary: 處理 Webhook 通知
      description: |
        接收 Shopline Payment 的 Webhook 通知。不需要 WordPress 認證，使用 HMAC-SHA256 簽章驗證。

        簽章計算方式：hash_hmac("sha256", "{timestamp}.{body}", signKey)

        驗證規則：
        1. timestamp 必須在 5 分鐘容許範圍內（本地環境跳過）
        2. HMAC-SHA256 簽章必須正確（本地環境跳過）
        3. apiVersion 非 V1 時記錄 warning 但不阻擋

        處理邏輯：
        - 付款交易 SUCCEEDED: 訂單狀態改為 processing
        - 付款交易 EXPIRED: 訂單狀態改為 cancelled
        - 付款交易其他狀態: 訂單狀態保持 pending
        - 退款交易 SUCCEEDED: 記錄退款詳情，清除暫存退款原因
        - 退款交易 FAILED: 刪除最近一筆退款記錄

        原則：收到通知始終回傳 200，避免 SLP 重試。
      operationId: handleWebhook
      security:
        - hmacSha256: []
      servers:
        - url: /wp-json/power-checkout/slp
      parameters:
        - name: timestamp
          in: header
          required: true
          schema:
            type: string
          description: 毫秒級時間戳
        - name: sign
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 簽章
        - name: apiVersion
          in: header
          required: true
          schema:
            type: string
            enum: [V1]
          description: API 版本（預期為 V1）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: 處理成功（始終回傳 200 避免 SLP 重試）
        "500":
          description: |
            處理失敗，回傳 mapping_order_failed。錯誤訊息依情境：
            - "Invalid timestamp, current: {ts}, received: {ts}, diff: {diff}"（時間戳超出範圍）
            - "Invalid sign, calculated: {hash}, actual: {sign}"（簽章不正確）
            - "找不到訂單，tradeOrderId: {id}"（找不到對應訂單）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      code:
                        example: "mapping_order_failed"

  # ==================== 綠界 ECPay ====================
  # 注意：以下端點的 base URL 為 /wp-json/power-checkout/ecpay
  #       三個 callback（aio/return、aio/payment-info、ecpg/return）回應一律純文字 "1|OK" + HTTP 200（非 JSON）

  /aio/return:
    post:
      tags: [ECPay]
      summary: 綠界 AIO 付款結果通知（ReturnURL）
      description: |
        接收綠界 AIO 全方位金流的付款結果幕後通知（Server-to-Server，Form POST）。
        不需要 WordPress 認證，以 CheckMacValue（SHA256）timing-safe 驗章。

        處理規則：
        1. 驗章（hash_equals 比對重新計算的 CheckMacValue）。失敗 → log warning、不更新明細、維持狀態（仍回 1|OK）。
        2. 以 MerchantTradeNo 反查訂單（_pc_ecpay_trade_no）。找不到 → 拋例外但仍回 1|OK。
        3. 冪等：訂單已是 processing → skip。
        4. RtnCode（字串）="1" → 訂單轉 processing，寫入 _pc_ecpay_payment_detail + order note；
           非 "1" → 維持 pending，記錄失敗 RtnCode/RtnMsg。

        原則：無論成敗始終回應純文字 `1|OK`、HTTP 200，避免綠界最多 4 次重送風暴。
      operationId: ecpayAioReturn
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EcpayAioReturnPayload"
      responses:
        "200":
          description: 始終回傳純文字 `1|OK`（HTTP 200，Content-Type text/plain）
          content:
            text/plain:
              schema:
                type: string
                example: "1|OK"

  /aio/payment-info:
    post:
      tags: [ECPay]
      summary: 綠界 AIO 取號結果通知（PaymentInfoURL）
      description: |
        接收綠界 AIO 的 ATM/CVS/BARCODE 取號結果幕後通知（Form POST，非同步、付款前送達）。
        不需要 WordPress 認證，以 CheckMacValue（SHA256）驗章。

        處理規則：
        1. 驗章失敗 → 不寫入取號資訊、不改狀態。
        2. 僅處理取號成功碼（RtnCode "2"=ATM、"10100073"=CVS/BARCODE）；其餘忽略。
        3. 以 MerchantTradeNo 反查訂單；冪等：已寫入 _pc_ecpay_payment_info 則 skip。
        4. 取號成功 → 寫入 _pc_ecpay_payment_info（虛擬帳號/超商代碼/條碼/繳費期限）+ order note，
           **不改訂單狀態**（維持等待付款）。

        ⚠️ RtnCode "2" / "10100073" 為取號成功（非錯誤），不可視為失敗取消訂單。
      operationId: ecpayAioPaymentInfo
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EcpayAioPaymentInfoPayload"
      responses:
        "200":
          description: 始終回傳純文字 `1|OK`（HTTP 200，Content-Type text/plain）
          content:
            text/plain:
              schema:
                type: string
                example: "1|OK"

  /ecpg/return:
    post:
      tags: [ECPay]
      summary: 綠界站內付 2.0（ECPG）付款結果通知（ReturnURL）
      description: |
        接收綠界站內付 2.0 的付款結果幕後通知（Server-to-Server，JSON POST）。
        不需要 WordPress 認證。雙層錯誤檢查 + AES-128-CBC 解密：

        1. 傳輸層 TransCode（整數）=== 1 才繼續；非 1 → 記錄傳輸層失敗 order note、維持狀態。
        2. AES-128-CBC 解密 Data（key/iv 取 HashKey/HashIV 前 16 bytes）。
           解密失敗 → 維持 pending、不更新明細、log warning（仍回 1|OK）。
        3. 由解密後 OrderInfo.MerchantTradeNo 反查訂單；找不到 → 拋例外（仍回 1|OK）。
        4. 冪等：訂單已 processing → skip。
        5. 業務層 RtnCode（**整數**）=== 1 → 訂單轉 processing，寫入 _pc_ecpay_payment_detail + order note；
           非 1 → 維持 pending，記錄失敗 RtnCode/RtnMsg。

        ⚠️ 與 AIO 差異：AIO RtnCode 為字串 "1"；ECPG 解密後 RtnCode 為整數 1（型別比對不同）。
        原則：始終回應純文字 `1|OK`、HTTP 200。
      operationId: ecpgReturn
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcpgReturnPayload"
      responses:
        "200":
          description: 始終回傳純文字 `1|OK`（HTTP 200，Content-Type text/plain）
          content:
            text/plain:
              schema:
                type: string
                example: "1|OK"

  /ecpg/create-payment:
    post:
      tags: [ECPay]
      summary: 綠界站內付 2.0（ECPG）建立付款（前端 SDK 觸發）
      description: |
        站內付 2.0 前端 JS SDK 收卡取得 PayToken 後，將 { order_id, order_key, pay_token } POST 至此端點，
        後端呼叫綠界 CreatePayment（ecpg domain），解析巢狀 ThreeDInfo.ThreeDURL 後回傳，前端據此導向 3DS。

        驗證機制：**order_key**（非 nonce）。因站內付支援訪客結帳，WP REST nonce 綁定登入 session 不穩定，
        改以 WooCommerce 原生「持有訂單即授權」憑證比對 $order->get_order_key()（timing-safe）。

        授權與驗證流程：
        1. order_id 取訂單；不存在 → 404。
        2. order_key 比對失敗或為空 → 403「訂單驗證失敗」。
        3. 訂單付款方式非 ecpay_ecpg → 400「此訂單非綠界站內付」。
        4. pay_token 為空 → 400「pay_token 必填」。
        5. 取訂單 MerchantTradeNo（GetTokenbyTrade 階段寫入）；缺少 → 拋例外 → 400。
        6. 呼叫 CreatePayment → 回 { code, message, data:{ three_d_url, need_3ds } }。

        例外一律 catch，回 { code:"error" } + HTTP 400，不外洩內部細節。
      operationId: ecpgCreatePayment
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcpgCreatePaymentRequest"
      responses:
        "200":
          description: 建立付款成功（含是否需 3DS）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcpgCreatePaymentResponse"
        "400":
          description: |
            建立失敗，錯誤訊息依情境：
            - "此訂單非綠界站內付"（付款方式不符）
            - "pay_token 必填"
            - "建立付款失敗，請稍後再試或聯繫商家"（綠界傳輸層/業務層失敗，細節已寫 order note/log）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcpgCreatePaymentResponse"
        "403":
          description: 訂單驗證失敗（order_key 不符）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcpgCreatePaymentResponse"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcpgCreatePaymentResponse"

  # ==================== Logistics（綠界全方位物流 v2 / 統一抽象）====================

  /logistics/{order_id}/store-selection:
    post:
      tags: [Logistics]
      summary: 取得物流選店導轉頁（階段 A）
      description: |
        ILogisticsProvider::get_store_selection()。建立綠界暫存物流單（RedirectToLogisticsSelection，
        TempLogisticsID=0），回傳綠界 RWD 選店頁供前端導轉。
        WC 整合：綠界物流做成 WC_Shipping_Method，顧客在 classic checkout 結帳頁點「選擇門市」觸發。
        account_type（b2c/c2c）決定使用的帳號與憑證；COD 訂單帶 IsCollection=Y + CollectionAmount。
      operationId: logisticsStoreSelection
      servers:
        - url: /wp-json/power-checkout/v1
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_type:
                  $ref: "#/components/schemas/LogisticsSubType"
      responses:
        "200":
          description: 取得選店導轉頁成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsStoreSelectionResponse"
        "400":
          description: |
            前置（參數）驗證失敗：
            - "ClientReplyURL 必須為公開可訪問的 URL"
            - "運送方式必須為已啟用的綠界物流子類型"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 綠界全方位物流未啟用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logistics/selection-callback:
    post:
      tags: [Logistics]
      summary: 物流選店回呼（ClientReplyURL）
      description: |
        ILogisticsProvider::parse_store_selection()。顧客在綠界 RWD 頁選店後，綠界以瀏覽器 Form POST
        至此端點，body 含 ResultData（AES 加密）。不需要 WordPress 認證，授權以 AES 解密能力把關。
        解密取 TempLogisticsID 與門市資訊，暫存於 order meta（_pc_logistics_temp_id / _pc_logistics_store_*）。
      operationId: logisticsSelectionCallback
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LogisticsSelectionCallbackPayload"
      responses:
        "200":
          description: 選店結果處理完成（解析成功暫存門市；解析失敗記錄並回應）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /logistics/{order_id}/create-shipment:
    post:
      tags: [Logistics]
      summary: 成立正式物流單（階段 B）
      description: |
        ILogisticsProvider::create_shipment()。管理員於後台訂單頁手動觸發，憑 TempLogisticsID 呼叫
        CreateByTempTrade 成立正式物流單，取得 LogisticsID 存 _pc_logistics_ref。
        雙層檢查（外層 TransCode 整數 1 → 解密 Data → 內層 RtnCode 整數 1）。
        C2C 額外保存 CVSPaymentNo / CVSValidationNo。
      operationId: logisticsCreateShipment
      servers:
        - url: /wp-json/power-checkout/v1
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 物流單成立成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsShipmentResponse"
        "400":
          description: |
            成立失敗：
            - "傳輸層錯誤（TransCode）"
            - "業務層錯誤（RtnCode）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 尚未選店，無暫存物流單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logistics/{order_id}:
    get:
      tags: [Logistics]
      summary: 查詢物流單即時狀態
      description: |
        ILogisticsProvider::query_shipment()。管理員於後台查詢物流單即時狀態（QueryLogisticsTradeInfo）。
      operationId: logisticsQuery
      servers:
        - url: /wp-json/power-checkout/v1
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 查詢成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsQueryResponse"
        "403":
          description: 尚未成立物流單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logistics/{order_id}/print:
    post:
      tags: [Logistics]
      summary: 列印託運單
      description: |
        ILogisticsProvider::print_document()。管理員列印託運單（PrintTradeDocument，回 HTML，
        請求帶 LogisticsID 與 LogisticsSubType）。
      operationId: logisticsPrintDocument
      servers:
        - url: /wp-json/power-checkout/v1
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 列印成功，回傳託運單 HTML
          content:
            text/html:
              schema:
                type: string
        "403":
          description: 尚未成立物流單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logistics/{order_id}/cancel:
    post:
      tags: [Logistics]
      summary: 取消 C2C 物流單
      description: |
        ILogisticsProvider::cancel_shipment()。取消尚未寄件的 C2C 物流單（CancelC2COrder，僅 C2C 帳號，
        需 CVSPaymentNo / CVSValidationNo）。成功後標記 _pc_logistics_status=cancelled。
      operationId: logisticsCancelShipment
      servers:
        - url: /wp-json/power-checkout/v1
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: 缺少 C2C 寄貨編號，無法取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 取消物流單僅支援 C2C 帳號
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 找不到訂單
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logistics/status-callback:
    post:
      tags: [Logistics]
      summary: 物流貨態通知（ServerReplyURL）
      description: |
        ILogisticsProvider::handle_status_callback()。綠界以 JSON body POST 貨態通知（AES-JSON 三層）。
        不需要 WordPress 認證，授權以 MerchantID 驗證 + LogisticsID 比對把關。
        驗 MerchantID、比對 LogisticsID、防重（記已處理碼）；回應必須是 AES 加密 JSON 三層結構（非 1|OK），
        否則綠界隔 60 分重送最多 3 次。COD 訂單取件完成時標記 _pc_logistics_collection_paid=yes。
      operationId: logisticsStatusCallback
      security: []
      servers:
        - url: /wp-json/power-checkout/ecpay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogisticsStatusCallbackPayload"
      responses:
        "200":
          description: 始終回應 AES 加密 JSON 三層結構（HTTP 200，application/json）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsAesJsonResponse"
